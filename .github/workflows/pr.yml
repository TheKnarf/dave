name: Build

on:
  push:
    branches:
      - main
  pull_request:

env:
  IMAGE_NAME: theknarf/dave

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Tests
        run: yarn test

      - name: Build Docker image
        run: docker build . --tag $IMAGE_NAME
